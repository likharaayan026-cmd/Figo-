<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Movie Download App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #141414;
            --bg-secondary: #1f1f1f;
            --bg-card: #2a2a2a;
            --text-primary: #e5e5e5;
            --text-secondary: #999;
            --accent: #e50914;
            --accent-hover: #f40612;
            --border: #404040;
            --shadow: rgba(0, 0, 0, 0.5);
            --gold: #ffd700;
        }

        body.light-mode {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #141414;
            --text-secondary: #555;
            --border: #e0e0e0;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background 0.3s ease;
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        /* Modern Splash Screen */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .splash-logo {
            font-size: 55px;
            font-weight: 800;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 15px;
            animation: zoomPulse 1.8s infinite alternate;
        }

        .splash-title {
            margin-top: 15px;
            font-size: 18px;
            letter-spacing: 2px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .spinner {
            margin-top: 35px;
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes zoomPulse {
            0% { transform: scale(0.95); filter: drop-shadow(0 0 5px rgba(229, 9, 20, 0.4)); }
            100% { transform: scale(1.05); filter: drop-shadow(0 0 20px rgba(229, 9, 20, 0.8)); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Mandatory Auth Overlay Screen */
        .auth-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            background: var(--bg-secondary);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 16px 48px var(--shadow);
            border: 1px solid var(--border);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--accent), #ff6b6b);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            margin: 0 auto 15px;
            box-shadow: 0 8px 24px rgba(229, 9, 20, 0.3);
        }

        .auth-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .auth-subtitle {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: var(--bg-card);
            padding: 5px;
            border-radius: 12px;
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .auth-tab.active {
            background: var(--accent);
            color: white;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 16px;
        }

        .auth-input {
            width: 100%;
            padding: 12px 15px 12px 42px;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s;
        }

        .auth-input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg-secondary);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), #f40612);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 16px rgba(229, 9, 20, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-google {
            background: #ffffff;
            color: #333333;
            margin-top: 10px;
            box-shadow: 0 4px 16px rgba(255, 255, 255, 0.1);
        }

        .btn-google:hover {
            background: #f1f1f1;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 15px 0;
            color: var(--text-secondary);
            font-size: 12px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }

        .divider span {
            padding: 0 10px;
        }

        .error-message, .success-message {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            display: none;
        }

        .error-message {
            background: rgba(244, 67, 54, 0.15);
            border: 1px solid #f44336;
            color: #f44336;
        }

        .success-message {
            background: rgba(76, 175, 80, 0.15);
            border: 1px solid #4caf50;
            color: #4caf50;
        }

        /* Header with Search */
        header {
            background: var(--bg-secondary);
            padding: 15px 20px;
            box-shadow: 0 2px 8px var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            gap: 15px;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .header-search {
            flex: 1;
            position: relative;
        }

        .header-search input {
            width: 100%;
            padding: 12px 45px 12px 20px;
            border: 1px solid var(--border);
            border-radius: 25px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 15px;
        }

        .header-search input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .header-search-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 16px;
        }

        /* Subscription Banner */
        .sub-banner {
            background: linear-gradient(135deg, #2c1b02, #4a3000);
            border: 1px solid var(--gold);
            padding: 12px 20px;
            margin: 15px 20px 0 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .sub-banner-text {
            color: var(--gold);
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sub-btn {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }

        /* 3D Carousel */
        .carousel-container {
            height: 320px;
            position: relative;
            perspective: 1200px;
            overflow: hidden;
            margin: 15px 0 0 0;
        }

        .carousel {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .carousel-item {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 180px;
            height: 270px;
            margin-left: -90px;
            margin-top: -135px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px var(--shadow);
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .carousel-item-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            padding: 30px 15px 15px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
        }

        .carousel-controls {
            position: absolute;
            top: 50%;
            width: 100%;
            transform: translateY(-50%);
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
            pointer-events: none;
        }

        .carousel-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            pointer-events: all;
            transition: all 0.3s;
        }

        /* Genre Filters */
        .genre-section {
            padding: 15px 20px 0 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .genre-filters {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
            scrollbar-width: none;
        }

        .genre-chip {
            padding: 10px 20px;
            border-radius: 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }

        .genre-chip.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Movie Grid */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 15px 20px 20px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .movie-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 4px 16px var(--shadow);
        }

        .movie-card img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
        }

        .movie-card-info {
            padding: 15px;
        }

        .movie-card-title {
            font-size: 16px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .movie-card-genre {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* Modals */
        .modal, .settings-modal, .subscription-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            overflow-y: auto;
        }

        .modal-content, .settings-card, .sub-card {
            background: var(--bg-secondary);
            max-width: 600px;
            margin: 40px auto;
            border-radius: 20px;
            padding: 25px;
            position: relative;
        }

        .modal-close, .settings-close {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: var(--bg-card);
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .modal-poster {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .video-player {
            width: 100%;
            height: 0;
            padding-bottom: 56.25%;
            background: #000;
            position: relative;
            display: none;
            margin-bottom: 15px;
        }

        .video-player.active {
            display: block;
        }

        .video-player iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-pay-razer {
            background: linear-gradient(135deg, #02042b, #0c2340);
            border: 1px solid #3399cc;
            color: white;
            font-size: 16px;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--bg-secondary);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
            border-top: 1px solid var(--border);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-secondary);
            background: transparent;
            border: none;
            font-size: 12px;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent);
        }

        @media (min-width: 768px) {
            .movies-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>
<body>

    <div class="splash-screen" id="splash">
        <div class="splash-logo">
            <i class="fas fa-film"></i> MovieBox
        </div>
        <div class="splash-title">Unlimited Movies & Entertainment</div>
        <div class="spinner"></div>
    </div>

    <div class="auth-screen" id="auth-screen">
        <div class="auth-container">
            <div class="auth-header">
                <div class="auth-icon">
                    <i class="fas fa-user-circle"></i>
                </div>
                <h2 class="auth-title">Welcome Back</h2>
                <p class="auth-subtitle">Login or Register to watch movies</p>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">Login</button>
                <button class="auth-tab" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <form class="auth-form active" id="login-form">
                <div id="login-message" class="error-message"></div>
                <div class="input-group">
                    <label class="input-label">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" class="auth-input" id="login-email" placeholder="Enter your email" required>
                    </div>
                </div>
                <div class="input-group">
                    <label class="input-label">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" class="auth-input" id="login-password" placeholder="Enter password" required>
                    </div>
                </div>
                <button type="submit" class="btn" id="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Login & Continue
                </button>
            </form>

            <form class="auth-form" id="signup-form">
                <div id="signup-message" class="error-message"></div>
                <div class="input-group">
                    <label class="input-label">Full Name</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" class="auth-input" id="signup-name" placeholder="Enter full name" required>
                    </div>
                </div>
                <div class="input-group">
                    <label class="input-label">Mobile Number (Optional)</label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone input-icon"></i>
                        <input type="tel" class="auth-input" id="signup-mobile" placeholder="Enter mobile number">
                    </div>
                </div>
                <div class="input-group">
                    <label class="input-label">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" class="auth-input" id="signup-email" placeholder="Enter email" required>
                    </div>
                </div>
                <div class="input-group">
                    <label class="input-label">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" class="auth-input" id="signup-password" placeholder="Create password (min 6 chars)" required>
                    </div>
                </div>
                <button type="submit" class="btn" id="signup-btn">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>

            <div class="divider"><span>OR</span></div>

            <button class="btn btn-google" onclick="loginWithGoogle()">
                <i class="fab fa-google" style="color: #4285F4;"></i> Continue with Google
            </button>
        </div>
    </div>

    <div id="app-dashboard" style="display: none;">
        <header>
            <div class="header-content">
                <div class="logo"><i class="fas fa-film"></i> MovieBox</div>
                <div class="header-search">
                    <input type="text" id="search-input" placeholder="Search movies..." oninput="filterMovies()">
                    <i class="fas fa-search header-search-icon"></i>
                </div>
            </div>
        </header>

        <div class="sub-banner" id="sub-status-bar">
            <div class="sub-banner-text">
                <i class="fas fa-crown"></i>
                <span id="sub-bar-text">Subscription Status: Inactive</span>
            </div>
            <button class="sub-btn" id="sub-bar-btn" onclick="openSubscriptionModal()">Subscribe ₹20</button>
        </div>

        <main>
            <div class="carousel-container" id="carousel-container">
                <div class="carousel" id="carousel"></div>
            </div>

            <div class="genre-section">
                <div class="genre-filters" id="genre-filters"></div>
            </div>

            <div class="movies-grid" id="movies-grid"></div>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="showHome()"><i class="fas fa-home"></i><span>Home</span></button>
            <button class="nav-item" onclick="openSubscriptionModal()"><i class="fas fa-crown"></i><span>Plan</span></button>
            <button class="nav-item" onclick="openSettings()"><i class="fas fa-cog"></i><span>Settings</span></button>
        </nav>
    </div>

    <div class="subscription-modal" id="subscription-modal">
        <div class="sub-card">
            <button class="modal-close" onclick="closeSubscriptionModal()"><i class="fas fa-times"></i></button>
            <div style="text-align: center; margin-bottom: 20px;">
                <i class="fas fa-crown" style="font-size: 45px; color: var(--gold); margin-bottom: 10px;"></i>
                <h2>MovieBox Premium</h2>
                <p style="color: var(--text-secondary); margin-top: 5px;">Unlimited HD Movies & Streaming</p>
            </div>
            <div style="background: var(--bg-card); padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: center;">
                <h1 style="color: var(--gold);">₹20 <span style="font-size: 16px; color: var(--text-secondary);">/ 28 Days</span></h1>
                <p style="font-size: 13px; color: var(--text-secondary); margin-top: 8px;">Access valid strictly for 28 days upon payment.</p>
            </div>
            <button class="btn btn-pay-razer" onclick="startRazorpayPayment()">
                <i class="fas fa-shield-alt"></i> Pay ₹20 via Razorpay
            </button>
        </div>
    </div>

    <div class="modal" id="movie-modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
            <div id="modal-content-inner"></div>
        </div>
    </div>

    <div class="settings-modal" id="settings-modal">
        <div class="settings-card">
            <button class="settings-close" onclick="closeSettings()"><i class="fas fa-times"></i></button>
            <h2 style="margin-bottom: 20px;"><i class="fas fa-cog"></i> Settings</h2>
            <div style="padding: 15px; background: var(--bg-card); border-radius: 12px; margin-bottom: 15px;">
                <p id="user-display-email">User: loading...</p>
                <p id="user-display-sub" style="color: var(--gold); font-size: 13px; margin-top: 5px;"></p>
            </div>
            <button class="btn" style="background: #333;" onclick="logoutUser()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // ==================== CONFIGURATIONS ====================
        const firebaseConfig = {

        const RAZORPAY_KEY_ID = "rzp_live_T5OZeAeTkrB7YG"; // Razorpay Live Key

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

        let currentUser = null;
        let isSubscribed = false;
        let allMovies = [];
        let filteredMovies = [];

        // ==================== AUTH & SUBSCRIPTION GUARD ====================
        auth.onAuthStateChanged((user) => {
            hideSplashScreen();
            if (user) {
                currentUser = user;
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-dashboard').style.display = 'block';
                checkSubscriptionStatus();
                loadMovies();
            } else {
                currentUser = null;
                isSubscribed = false;
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('app-dashboard').style.display = 'none';
            }
        });

        function checkSubscriptionStatus() {
            if (!currentUser) return;
            
            database.ref('users/' + currentUser.uid + '/subscription').on('value', (snapshot) => {
                const subData = snapshot.val();
                const now = Date.now();

                if (subData && subData.expiryDate && subData.expiryDate > now) {
                    isSubscribed = true;
                    const daysLeft = Math.ceil((subData.expiryDate - now) / (1000 * 60 * 60 * 24));
                    document.getElementById('sub-bar-text').textContent = `VIP Premium Active (${daysLeft} Days left)`;
                    document.getElementById('sub-bar-btn').textContent = "Renew Plan";
                } else {
                    isSubscribed = false;
                    document.getElementById('sub-bar-text').textContent = "Subscription: Expired / Not Active";
                    document.getElementById('sub-bar-btn').textContent = "Subscribe ₹20";
                }
            });
        }

        // ==================== RAZORPAY PAYMENT ====================
        function startRazorpayPayment() {
            if (!currentUser) return;

            const options = {
                "key": RAZORPAY_KEY_ID,
                "amount": "2000", // ₹20 in paise
                "currency": "INR",
                "name": "MovieBox Premium",
                "description": "28 Days Premium Movie Subscription",
                "handler": function (response) {
                    if (response.razorpay_payment_id) {
                        saveSubscriptionToDatabase(response.razorpay_payment_id);
                    }
                },
                "prefill": {
                    "name": currentUser.displayName || "",
                    "email": currentUser.email || ""
                },
                "theme": {
                    "color": "#e50914"
                }
            };

            const rzp = new Razorpay(options);
            rzp.open();
        }

        function saveSubscriptionToDatabase(paymentId) {
            const expiry = Date.now() + (28 * 24 * 60 * 60 * 1000); // 28 Days Exact
            database.ref('users/' + currentUser.uid + '/subscription').set({
                paymentId: paymentId,
                amount: 20,
                active: true,
                subscribedAt: Date.now(),
                expiryDate: expiry
            }).then(() => {
                alert("Payment Successful! 28 Days Access Activated.");
                closeSubscriptionModal();
            }).catch(err => {
                alert("Database Error: " + err.message);
            });
        }

        // ==================== AUTH HANDLERS ====================
        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            
            if (tab === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('signup-form').classList.add('active');
            }
        }

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            
            auth.signInWithEmailAndPassword(email, pass).catch(err => {
                showAuthError('login-message', err.message);
            });
        });

        document.getElementById('signup-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('signup-name').value;
            const mobile = document.getElementById('signup-mobile').value;
            const email = document.getElementById('signup-email').value;
            const pass = document.getElementById('signup-password').value;

            auth.createUserWithEmailAndPassword(email, pass).then((cred) => {
                cred.user.updateProfile({ displayName: name });
                database.ref('users/' + cred.user.uid).set({
                    name: name,
                    mobile: mobile || "N/A",
                    email: email,
                    createdAt: Date.now()
                });
            }).catch(err => {
                showAuthError('signup-message', err.message);
            });
        });

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then(res => {
                database.ref('users/' + res.user.uid).update({
                    name: res.user.displayName,
                    email: res.user.email
                });
            }).catch(err => alert(err.message));
        }

        function logoutUser() {
            auth.signOut();
            closeSettings();
        }

        function showAuthError(id, msg) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 4000);
        }

        // ==================== MOVIES & PLAYBACK ====================
        function loadMovies() {
            database.ref('movies').on('value', (snapshot) => {
                allMovies = [];
                if (snapshot.exists()) {
                    snapshot.forEach(child => {
                        let m = child.val();
                        m.id = child.key;
                        allMovies.push(m);
                    });
                }
                filteredMovies = [...allMovies];
                displayMovies(filteredMovies);
                loadGenres();
            });
        }

        function displayMovies(movies) {
            const grid = document.getElementById('movies-grid');
            grid.innerHTML = '';
            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <img src="${movie.poster}" onerror="this.src='https://via.placeholder.com/200x300'">
                    <div class="movie-card-info">
                        <div class="movie-card-title">${movie.title}</div>
                        <div class="movie-card-genre">${movie.genre}</div>
                    </div>
                `;
                card.onclick = () => openMovieDetail(movie);
                grid.appendChild(card);
            });
        }

        function openMovieDetail(movie) {
            const container = document.getElementById('modal-content-inner');
            container.innerHTML = `
                <img src="${movie.poster}" class="modal-poster" id="movie-poster">
                <div class="video-player" id="video-player">
                    <iframe id="video-iframe" allowfullscreen></iframe>
                </div>
                <h2>${movie.title}</h2>
                <p style="color: var(--text-secondary); margin: 10px 0;">${movie.description || 'No description'}</p>
                
                <div class="action-buttons">
                    <button class="btn" style="background: ${isSubscribed ? '#4caf50' : '#e50914'}" onclick="handlePlayClick('${movie.playUrl}')">
                        <i class="fas ${isSubscribed ? 'fa-play' : 'fa-lock'}"></i> ${isSubscribed ? 'Play Movie' : 'Unlock & Play (₹20)'}
                    </button>
                </div>
            `;
            document.getElementById('movie-modal').style.display = 'block';
        }

        function handlePlayClick(playUrl) {
            if (!isSubscribed) {
                alert("Subscription Required! Pay ₹20 to stream movies for 28 days.");
                openSubscriptionModal();
            } else {
                playVideo(playUrl);
            }
        }

        function playVideo(url) {
            const poster = document.getElementById('movie-poster');
            const player = document.getElementById('video-player');
            const iframe = document.getElementById('video-iframe');
            
            poster.style.display = 'none';
            player.classList.add('active');
            iframe.src = url;
        }

        // ==================== UI HELPERS ====================
        function hideSplashScreen() {
            document.getElementById('splash').style.display = 'none';
        }
        function openSubscriptionModal() {
            document.getElementById('subscription-modal').style.display = 'block';
        }
        function closeSubscriptionModal() {
            document.getElementById('subscription-modal').style.display = 'none';
        }
        function closeModal() {
            document.getElementById('movie-modal').style.display = 'none';
        }
        function openSettings() {
            document.getElementById('settings-modal').style.display = 'block';
            if (currentUser) {
                document.getElementById('user-display-email').textContent = "Account: " + currentUser.email;
                document.getElementById('user-display-sub').textContent = isSubscribed ? "Status: VIP Active" : "Status: Free Member";
            }
        }
        function closeSettings() {
            document.getElementById('settings-modal').style.display = 'none';
        }
        function loadGenres() {
            const genres = ['All', ...new Set(allMovies.map(m => m.genre))];
            const filtersContainer = document.getElementById('genre-filters');
            filtersContainer.innerHTML = '';
            genres.forEach(genre => {
                const chip = document.createElement('div');
                chip.className = 'genre-chip' + (genre === 'All' ? ' active' : '');
                chip.textContent = genre;
                filtersContainer.appendChild(chip);
            });
        }
        function filterMovies() {
            const term = document.getElementById('search-input').value.toLowerCase();
            filteredMovies = allMovies.filter(m => m.title.toLowerCase().includes(term));
            displayMovies(filteredMovies);
        }
        function showHome() {
            displayMovies(allMovies);
        }
    </script>
</body>
</html>
