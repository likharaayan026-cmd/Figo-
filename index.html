<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Movie Download App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #141414;
            --bg-secondary: #1f1f1f;
            --bg-card: #2a2a2a;
            --text-primary: #e5e5e5;
            --text-secondary: #999;
            --accent: #e50914;
            --border: #333333;
            --shadow: rgba(0, 0, 0, 0.6);
            --gold: #ffd700;
            --green: #2ecc71;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            padding-bottom: 75px;
        }

        /* Splash Screen */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }

        .splash-logo {
            font-size: 42px;
            font-weight: 800;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .spinner {
            margin-top: 25px;
            width: 38px;
            height: 38px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Auth Screen */
        .auth-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 380px;
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 22px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px var(--shadow);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .auth-icon {
            width: 55px;
            height: 55px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            margin: 0 auto 10px;
        }

        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            background: var(--bg-card);
            padding: 4px;
            border-radius: 8px;
        }

        .auth-tab {
            flex: 1;
            padding: 8px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
        }

        .auth-tab.active {
            background: var(--accent);
            color: white;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 14px;
        }

        .auth-input {
            width: 100%;
            padding: 10px 12px 10px 36px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 14px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: white;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
        }

        .btn-google {
            background: #ffffff;
            color: #333;
            margin-top: 10px;
        }

        /* Header */
        header {
            background: var(--bg-secondary);
            padding: 12px 15px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .header-content {
            display: flex;
            gap: 12px;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent);
        }

        .header-search {
            flex: 1;
            position: relative;
        }

        .header-search input {
            width: 100%;
            padding: 8px 35px 8px 15px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 13px;
        }

        .header-search-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Subscription Banner */
        .sub-banner {
            background: linear-gradient(90deg, #2a2000 0%, #1a1400 100%);
            border: 1px solid var(--gold);
            padding: 10px 15px;
            margin: 12px 15px 5px 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sub-banner-text {
            color: var(--gold);
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sub-btn {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }

        /* Genre Filters (Placed directly under banner) */
        .genre-section {
            padding: 8px 15px 0 15px;
        }

        .genre-filters {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0;
            scrollbar-width: none;
        }

        .genre-filters::-webkit-scrollbar {
            display: none;
        }

        .genre-chip {
            padding: 6px 16px;
            border-radius: 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }

        .genre-chip.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Movie Grid */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 12px 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .movie-card {
            background: var(--bg-secondary);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--border);
        }

        .movie-card img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            display: block;
        }

        .movie-card-info {
            padding: 8px 10px;
        }

        .movie-card-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-card-genre {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--bg-secondary);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 100;
            border-top: 1px solid var(--border);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: var(--text-secondary);
            background: transparent;
            border: none;
            font-size: 11px;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent);
        }

        /* Modals */
        .modal, .subscription-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            padding: 15px;
            overflow-y: auto;
        }

        .modal-content {
            background: var(--bg-secondary);
            max-width: 480px;
            margin: 20px auto;
            border-radius: 14px;
            padding: 18px;
            position: relative;
            border: 1px solid var(--border);
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 12px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-poster {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .video-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 8px;
            display: none;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Benefits List in Plan Modal */
        .benefits-list {
            text-align: left;
            margin: 15px 0;
            background: var(--bg-card);
            padding: 12px 15px;
            border-radius: 10px;
            list-style: none;
        }

        .benefits-list li {
            font-size: 13px;
            color: var(--text-primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .benefits-list li i {
            color: var(--green);
        }

        .benefits-list li:last-child {
            margin-bottom: 0;
        }

        .btn-play {
            background: var(--accent);
            margin-top: 8px;
        }

        .btn-trailer {
            background: #333;
            color: white;
            margin-top: 8px;
        }

        .error-message {
            background: rgba(244, 67, 54, 0.15);
            border: 1px solid #f44336;
            color: #f44336;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 10px;
            display: none;
        }

        @media (min-width: 768px) {
            .movies-grid { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
<body>

    <div class="splash-screen" id="splash">
        <div class="splash-logo"><i class="fas fa-film"></i> MovieBox</div>
        <div class="spinner"></div>
    </div>

    <div class="auth-screen" id="auth-screen">
        <div class="auth-container">
            <div class="auth-header">
                <div class="auth-icon"><i class="fas fa-user"></i></div>
                <h2>Welcome</h2>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">Login</button>
                <button class="auth-tab" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <form class="auth-form active" id="login-form">
                <div id="login-message" class="error-message"></div>
                <div class="input-group">
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" class="auth-input" id="login-email" placeholder="Email" required>
                    </div>
                </div>
                <div class="input-group">
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" class="auth-input" id="login-password" placeholder="Password" required>
                    </div>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>

            <form class="auth-form" id="signup-form">
                <div id="signup-message" class="error-message"></div>
                <div class="input-group">
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" class="auth-input" id="signup-name" placeholder="Full Name" required>
                    </div>
                </div>
                <div class="input-group">
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" class="auth-input" id="signup-email" placeholder="Email" required>
                    </div>
                </div>
                <div class="input-group">
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" class="auth-input" id="signup-password" placeholder="Password (min 6 chars)" required>
                    </div>
                </div>
                <button type="submit" class="btn">Create Account</button>
            </form>

            <button class="btn btn-google" onclick="loginWithGoogle()">
                <i class="fab fa-google" style="color: #4285F4;"></i> Google Login
            </button>
        </div>
    </div>

    <div id="app-dashboard" style="display: none;">
        <header>
            <div class="header-content">
                <div class="logo"><i class="fas fa-film"></i> MovieBox</div>
                <div class="header-search">
                    <input type="text" id="search-input" placeholder="Search movies..." oninput="filterMovies()">
                    <i class="fas fa-search header-search-icon"></i>
                </div>
            </div>
        </header>

        <div class="sub-banner">
            <span class="sub-banner-text" id="sub-bar-text"><i class="fas fa-crown"></i> Plan Status: Free</span>
            <button class="sub-btn" id="sub-bar-btn" onclick="openSubModal()">Subscribe ₹19</button>
        </div>

        <main>
            <div class="genre-section">
                <div class="genre-filters" id="genre-filters"></div>
            </div>

            <div class="movies-grid" id="movies-grid"></div>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="showHome()"><i class="fas fa-home"></i><span>Home</span></button>
            <button class="nav-item" onclick="openSubModal()"><i class="fas fa-crown"></i><span>Plan</span></button>
            <button class="nav-item" onclick="logoutUser()"><i class="fas fa-sign-out-alt"></i><span>Logout</span></button>
        </nav>
    </div>

    <div class="subscription-modal" id="subscription-modal">
        <div class="modal-content" style="text-align: center;">
            <button class="modal-close" onclick="closeSubModal()">×</button>
            <i class="fas fa-crown" style="font-size: 38px; color: var(--gold); margin-bottom: 5px;"></i>
            <h2 style="font-size: 20px;">MovieBox VIP Plan</h2>
            <h1 style="color: var(--gold); font-size: 32px; margin: 8px 0;">₹19 <span style="font-size: 14px; color: var(--text-secondary);">/ 28 Days</span></h1>

            <ul class="benefits-list">
                <li><i class="fas fa-check-circle"></i> Unlimited Mobile Watching</li>
                <li><i class="fas fa-check-circle"></i> Complete 28 Days Full Validity</li>
                <li><i class="fas fa-check-circle"></i> All HD Movies & Series Unlocked</li>
                <li><i class="fas fa-check-circle"></i> Fast & Buffer-free Streaming</li>
            </ul>

            <button class="btn" style="background: var(--gold); color: black; font-weight: bold;" onclick="startRazorpayPayment()">
                Pay ₹19 via Razorpay
            </button>
        </div>
    </div>

    <div class="modal" id="movie-modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeMovieModal()">×</button>
            
            <img src="" class="modal-poster" id="modal-poster">
            
            <div class="video-container" id="video-container">
                <iframe id="video-player-iframe" allowfullscreen></iframe>
            </div>

            <h2 id="modal-movie-title" style="font-size: 18px;"></h2>
            <p id="modal-movie-desc" style="color: var(--text-secondary); margin: 8px 0; font-size: 13px;"></p>

            <button class="btn btn-trailer" id="modal-trailer-btn">
                <i class="fas fa-play-circle"></i> Play Trailer
            </button>
            
            <button class="btn btn-play" id="modal-play-btn">
                <i class="fas fa-play"></i> Watch Movie
            </button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBt3iYcR4SijEJqtrBlH8mNr292vakgJFQ",
            authDomain: "figo-movies.firebaseapp.com",
            databaseURL: "https://figo-movies-default-rtdb.firebaseio.com",
            projectId: "figo-movies",
            storageBucket: "figo-movies.firebasestorage.app",
            messagingSenderId: "425238806262",
            appId: "1:425238806262:web:7d23814e4b550695bb76d7"
        };

        const RAZORPAY_KEY_ID = "rzp_live_T5OZeAeTkrB7YG";

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let currentUser = null;
        let isSubscribed = false;
        let allMovies = [];
        let selectedGenre = 'All';

        auth.onAuthStateChanged((user) => {
            document.getElementById('splash').style.display = 'none';
            if (user) {
                currentUser = user;
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-dashboard').style.display = 'block';
                checkSubscriptionStatusWithExpiry();
                loadMovies();
            } else {
                currentUser = null;
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('app-dashboard').style.display = 'none';
            }
        });

        // Strict 28 Days Expiry & Auto Reset Check via Firebase Time
        function checkSubscriptionStatusWithExpiry() {
            if (!currentUser) return;

            database.ref('users/' + currentUser.uid + '/subscription').on('value', (snapshot) => {
                const sub = snapshot.val();
                const now = Date.now();

                if (sub && sub.expiryDate && sub.expiryDate > now) {
                    isSubscribed = true;
                    const daysLeft = Math.ceil((sub.expiryDate - now) / (1000 * 60 * 60 * 24));
                    document.getElementById('sub-bar-text').innerHTML = `<i class="fas fa-crown"></i> VIP Active (${daysLeft} Days left)`;
                    document.getElementById('sub-bar-btn').textContent = 'Renew ₹19';
                } else {
                    // Reset to free status if 28 days completed
                    isSubscribed = false;
                    document.getElementById('sub-bar-text').innerHTML = `<i class="fas fa-crown"></i> Subscription: Expired / Free`;
                    document.getElementById('sub-bar-btn').textContent = 'Subscribe ₹19';

                    if (sub && sub.expiryDate <= now) {
                        // Reset expired sub in DB
                        database.ref('users/' + currentUser.uid + '/subscription').update({
                            active: false,
                            expired: true
                        });
                    }
                }
            });
        }

        function loadMovies() {
            database.ref('movies').on('value', (snapshot) => {
                allMovies = [];
                if (snapshot.exists()) {
                    snapshot.forEach(child => {
                        let movie = child.val();
                        movie.id = child.key;
                        allMovies.push(movie);
                    });
                }
                filterMovies();
                loadGenres();
            });
        }

        function loadGenres() {
            const rawGenres = allMovies.map(m => m.genre).filter(Boolean);
            const genres = ['All', ...new Set(rawGenres)];

            const container = document.getElementById('genre-filters');
            container.innerHTML = '';

            genres.forEach(genre => {
                const chip = document.createElement('div');
                chip.className = 'genre-chip' + (genre === selectedGenre ? ' active' : '');
                chip.textContent = genre;
                chip.onclick = () => {
                    selectedGenre = genre;
                    document.querySelectorAll('.genre-chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    filterMovies();
                };
                container.appendChild(chip);
            });
        }

        function filterMovies() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const filtered = allMovies.filter(movie => {
                const matchSearch = movie.title ? movie.title.toLowerCase().includes(search) : true;
                const matchGenre = selectedGenre === 'All' || (movie.genre && movie.genre.toLowerCase() === selectedGenre.toLowerCase());
                return matchSearch && matchGenre;
            });
            displayMovies(filtered);
        }

        function displayMovies(movies) {
            const grid = document.getElementById('movies-grid');
            grid.innerHTML = '';
            if (movies.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color: var(--text-secondary); padding: 30px;">No movies available</p>';
                return;
            }
            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <img src="${movie.poster}" onerror="this.src='https://via.placeholder.com/200x300'">
                    <div class="movie-card-info">
                        <div class="movie-card-title">${movie.title}</div>
                        <div class="movie-card-genre">${movie.genre || ''}</div>
                    </div>
                `;
                card.onclick = () => openMovieModal(movie);
                grid.appendChild(card);
            });
        }

        function openMovieModal(movie) {
            const poster = document.getElementById('modal-poster');
            const videoContainer = document.getElementById('video-container');
            const iframe = document.getElementById('video-player-iframe');
            
            poster.style.display = 'block';
            videoContainer.style.display = 'none';
            iframe.src = '';

            document.getElementById('modal-movie-title').textContent = movie.title;
            document.getElementById('modal-movie-desc').textContent = movie.description || 'No description available.';

            // Trailer Play Handler (Free for all)
            const trailerBtn = document.getElementById('modal-trailer-btn');
            trailerBtn.onclick = () => {
                if (movie.trailerUrl) {
                    poster.style.display = 'none';
                    videoContainer.style.display = 'block';
                    iframe.src = movie.trailerUrl;
                } else {
                    alert('Trailer not available for this movie.');
                }
            };

            // Full Movie Watch Handler (Subscription Required)
            const playBtn = document.getElementById('modal-play-btn');
            playBtn.innerHTML = `<i class="fas ${isSubscribed ? 'fa-play' : 'fa-lock'}"></i> ${isSubscribed ? 'Watch Full Movie' : 'Unlock & Watch (₹19)'}`;
            
            playBtn.onclick = () => {
                if (!isSubscribed) {
                    alert('Subscription Required! Pay ₹19 to watch full movies for 28 days.');
                    openSubModal();
                } else {
                    if (movie.playUrl) {
                        poster.style.display = 'none';
                        videoContainer.style.display = 'block';
                        iframe.src = movie.playUrl;
                    } else {
                        alert('Movie stream link not available.');
                    }
                }
            };

            document.getElementById('movie-modal').style.display = 'block';
        }

        function startRazorpayPayment() {
            const options = {
                "key": RAZORPAY_KEY_ID,
                "amount": "100", // ₹19 in Paise
                "currency": "INR",
                "name": "MovieBox Premium",
                "description": "28 Days Mobile Access",
                "handler": function (res) {
                    const expiry = Date.now() + (28 * 24 * 60 * 60 * 1000); // 28 Days Exact
                    database.ref('users/' + currentUser.uid + '/subscription').set({
                        paymentId: res.razorpay_payment_id,
                        amount: 1,
                        active: true,
                        subscribedAt: Date.now(),
                        expiryDate: expiry
                    }).then(() => {
                        alert("Payment Successful! 28 Days Access Activated.");
                        closeSubModal();
                    });
                },
                "prefill": {
                    "name": currentUser.displayName || "",
                    "email": currentUser.email || ""
                },
                "theme": { "color": "#e50914" }
            };
            const rzp = new Razorpay(options);
            rzp.open();
        }

        /* Nav & Helpers */
        function switchTab(t) {
            document.querySelectorAll('.auth-tab').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(x => x.classList.remove('active'));
            if (t === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('signup-form').classList.add('active');
            }
        }

        document.getElementById('login-form').onsubmit = (e) => {
            e.preventDefault();
            auth.signInWithEmailAndPassword(
                document.getElementById('login-email').value,
                document.getElementById('login-password').value
            ).catch(err => alert(err.message));
        };

        document.getElementById('signup-form').onsubmit = (e) => {
            e.preventDefault();
            auth.createUserWithEmailAndPassword(
                document.getElementById('signup-email').value,
                document.getElementById('signup-password').value
            ).then(cred => {
                database.ref('users/' + cred.user.uid).set({
                    name: document.getElementById('signup-name').value,
                    email: cred.user.email,
                    createdAt: Date.now()
                });
            }).catch(err => alert(err.message));
        };

        function loginWithGoogle() {
            auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
        }

        function logoutUser() { auth.signOut(); }
        function openSubModal() { document.getElementById('subscription-modal').style.display = 'block'; }
        function closeSubModal() { document.getElementById('subscription-modal').style.display = 'none'; }
        function closeMovieModal() { 
            document.getElementById('video-player-iframe').src = '';
            document.getElementById('movie-modal').style.display = 'none'; 
        }
        function showHome() { selectedGenre = 'All'; filterMovies(); }
    </script>
</body>
</html>
